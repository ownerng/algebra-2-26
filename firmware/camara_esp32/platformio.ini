; Cámara USB del escáner 3D (ESP32-CAM AI Thinker)
;   pio run                 compila
;   pio run -t upload       compila y graba por /dev/ttyUSB0
[platformio]
src_dir = .

[env:esp32cam]
platform = espressif32
board = esp32cam
framework = arduino
upload_speed = 460800
monitor_speed = 1000000
build_flags = -DBOARD_HAS_PSRAM -mfix-esp32-psram-cache-issue
